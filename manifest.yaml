name: aliyun-oss-static-deploy-skill
display_name: 阿里云 OSS 静态站部署
version: 1.1.3
author: oracis
category: 开发编程
license: MIT
homepage: https://github.com/oracis/aliyun-oss-static-deploy-skill
description: 把纯静态站点（dist/web/out/build）部署到阿里云 OSS：自动建桶（默认香港免备案）、上传并按扩展名设置 Content-Type 与 Cache-Control、配置静态网站托管（index/404）、关闭默认开启的 BlockPublicAccess 解除匿名 403、添加 CNAME 绑定自定义域名、用 Let's Encrypt DNS-01 签发或复用通配证书并推送到 OSS/FC 启用 HTTPS，最后打通 GitHub Actions 自动部署（含 RAM 最小权限子账号、PyNaCl 加密写 Secret）与证书每日自动续期。内置踩坑对照表：BlockPublicAccess 403、MalformedXML、DomainNameNotResolved、CNAME 指错导致证书不生效等。v1.1.0 新增三个零/低依赖辅助脚本：deploy_oss.py（整目录/单文件上传、静态托管、公开访问、覆盖前自动备份、回读 md5+语义标记校验）、build_static.py（整理对外产物：剔除源码/密钥/未核实数据、替换 URL 占位符）、verify_deploy.py（对真实线上 URL 做语义验收）。
triggers:
  - 把这个站点推到阿里云
  - 部署到 OSS
  - 静态站上线
  - 绑定自定义域名
  - 给网站签个 HTTPS 证书
  - 配置 GitHub Actions 自动部署
  - 证书自动续期
  - 网站匿名访问 403 怎么修
  - deploy static site to aliyun oss
  - oss custom domain https
tags:
  - 阿里云
  - OSS
  - 静态站
  - 部署
  - HTTPS
  - Let's Encrypt
  - GitHub Actions
  - 证书续期
